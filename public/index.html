<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบสร้างภาพประกาศแจ้งเตือน | Suddhavej Hospital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Prompt:wght@400;500;600;700&family=Sarabun:wght@400;600;700&family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Prompt',system-ui,sans-serif;background:#eef2f5;color:#1e293b}
#err{display:none;position:fixed;top:0;left:0;right:0;z-index:9999;background:#b91c1c;color:#fff;padding:10px 16px;font-size:13px;line-height:1.5}
.appbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:10px 16px;background:linear-gradient(90deg,#14532d,#2f7a43);color:#fff;flex-wrap:wrap}
.appbar h1{font-size:16px;margin:0;font-weight:600;flex:1;min-width:170px}
.appbar .sub{font-size:11px;opacity:.85;font-weight:400;display:block}
.btn{border:0;border-radius:10px;padding:9px 14px;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;background:#fff;color:#14532d}
.btn.ghost{background:rgba(255,255,255,.16);color:#fff}
.btn.mini{padding:6px 9px;font-size:12px;background:#f1f5f9;color:#334155}
.btn.danger{background:#fee2e2;color:#b91c1c}
.btn.ok{background:#dcfce7;color:#15803d}
.layout{display:flex;align-items:flex-start}
#panel{width:400px;flex:none;background:#fff;border-right:1px solid #e2e8f0;height:calc(100vh - 58px);overflow-y:auto;padding:12px}
#stage{flex:1;padding:24px;height:calc(100vh - 58px);overflow:auto;text-align:center}
details{border:1px solid #e2e8f0;border-radius:12px;margin-bottom:10px;background:#fff}
summary{cursor:pointer;padding:11px 14px;font-weight:600;font-size:14px;background:#f8fafc;border-radius:11px;list-style:none}
summary::-webkit-details-marker{display:none}
.bd{padding:12px 14px}
label{display:block;font-size:12px;font-weight:500;color:#475569;margin:10px 0 4px}
input[type=text],input[type=date],input[type=file],select,textarea{width:100%;padding:8px 10px;border:1px solid #cbd5e1;border-radius:9px;font-family:inherit;font-size:13px;background:#fff}
input[type=color]{width:100%;height:36px;padding:2px;border:1px solid #cbd5e1;border-radius:9px;background:#fff}
input[type=range]{width:100%}
textarea{min-height:72px;resize:vertical;line-height:1.5}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;margin:10px 0}
.chk input{width:16px;height:16px}
.hint{font-size:11px;color:#64748b;margin-top:6px;line-height:1.5}
.warn{font-size:11px;color:#b45309;margin-top:6px;line-height:1.5;font-weight:500}
.sec{border:1px solid #e2e8f0;border-radius:11px;padding:10px;margin-bottom:9px;background:#fafafa}
.sechead{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.no{width:22px;height:22px;border-radius:50%;background:#2f7a43;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;flex:none}
.tplpick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tplpick button{border:2px solid #e2e8f0;background:#fff;border-radius:10px;padding:8px;cursor:pointer;font-family:inherit;font-size:11.5px;color:#334155;line-height:1.35}
.tplpick button.on{border-color:#2f7a43;background:#eaf5ee;color:#14532d;font-weight:600}
.sw{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.sw button{width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw button.on{border-color:#0f172a}
.sw button.cus{width:auto;border-radius:9px;padding:6px 10px;font-size:11px;font-family:inherit;background:#f1f5f9;color:#334155;border:2px solid #e2e8f0}
.sw button.cus.on{border-color:#0f172a}
.icrow{display:flex;align-items:center;gap:7px;padding:6px;border:1px solid #e2e8f0;border-radius:9px;margin-bottom:6px;background:#fafafa}
.icbox{width:34px;height:34px;border-radius:8px;background:#2f7a43;color:#fff;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.bar{height:8px;border-radius:5px;background:#e2e8f0;overflow:hidden;margin-top:6px}
.bar span{display:block;height:100%;background:#2f7a43}
#holder{display:inline-block;overflow:hidden;background:#fff;box-shadow:0 10px 28px rgba(0,0,0,.15);vertical-align:top}
#wrap{transform-origin:0 0}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 20px;border-radius:30px;font-size:13px;z-index:99;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
@media(max-width:900px){.layout{flex-direction:column}#panel{width:100%;height:auto}#stage{width:100%;height:auto;padding:14px}}

.poster{position:relative;display:flex;flex-direction:column;overflow:hidden;background:#fff;text-align:left}
.poster *{box-sizing:border-box}
.deco{position:absolute;border-radius:50%}
.logo{border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:contain}
.hl{color:#dc2626;font-weight:700}
.head{display:flex;align-items:center;gap:18px;position:relative;z-index:2}
.oline{width:5px;border-radius:3px;align-self:stretch}
.orgth{font-weight:700;line-height:1.15}
.orgen{font-weight:600;line-height:1.2}
.lvlw{display:flex;justify-content:center;position:relative;z-index:2}
.lvl{display:inline-flex;align-items:center;gap:12px;border-radius:100px;font-weight:600}
.dots{display:flex;gap:8px}
.dot{border-radius:50%}
.tbox{display:flex;align-items:center;gap:16px;position:relative;z-index:2}
.ttag{color:#dc2626;font-weight:700}
.ttl{font-weight:700}
.when{display:flex;align-items:center;gap:18px;flex-wrap:wrap;font-weight:600;position:relative;z-index:2}
.when .it{display:flex;align-items:center;gap:9px}
.sys{display:flex;align-items:center;justify-content:center;gap:14px;border-radius:100px;font-weight:700;position:relative;z-index:2}
.card{display:flex;flex-direction:column;position:relative;z-index:2}
.row{display:flex;gap:18px;border-radius:18px;align-items:flex-start}
.ric{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex:none;overflow:hidden}
.rb{flex:1;min-width:0}
.rl{display:inline-block;color:#fff;font-weight:700;border-radius:100px}
.rt{background:#eef1ef;border-radius:14px;color:#334155;line-height:1.55;font-weight:500;white-space:pre-wrap;word-break:break-word}
.pimg{border-radius:12px;object-fit:cover;display:block}
.foot{color:#fff;display:flex;align-items:center;gap:18px;margin-top:auto}
.foot .fl{flex:1;display:flex;align-items:center;gap:16px;min-width:0}
.ft{font-weight:600;line-height:1.35}
.fs{font-weight:400;opacity:.9}
.fr{display:flex;align-items:center;gap:16px;text-align:center}
.ph b{display:block;font-weight:700}
.ph i{font-style:normal;opacity:.85}
.note{text-align:center;color:#64748b}
</style>
</head>
<body>
<div id="err"></div>

<script>
window.onerror = function (m, s, l) {
  var e = document.getElementById('err');
  if (e) {
    e.style.display = 'block';
    e.innerHTML = '<b>พบข้อผิดพลาด :</b> ' + m + ' &nbsp;(บรรทัดที่ ' + l + ')';
  }
  return false;
};
</script>

<header class="appbar">
  <h1>ระบบสร้างภาพประกาศแจ้งเตือน<span class="sub">Suddhavej Hospital - Alert Poster Generator</span></h1>
  <button class="btn ghost" id="btnUndo">ย้อนกลับ</button>
  <button class="btn ghost" id="btnCopy">คัดลอกรูป</button>
  <button class="btn ghost" id="btnOpen">เปิดแท็บใหม่</button>
  <button class="btn" id="btnDl">บันทึกไฟล์</button>
</header>

<div class="layout">
<aside id="panel">

<details open><summary>1. เทมเพลตและรูปแบบ</summary><div class="bd">
  <label>เลือกเทมเพลต</label>
  <div class="tplpick" id="tplPick"></div>
  <label>ขนาดภาพ</label>
  <select data-b="ratio">
    <option value="a4">A4 แนวตั้ง (1080 x 1527)</option>
    <option value="4:5">4:5 โพสต์ Facebook (1080 x 1350)</option>
    <option value="1:1">1:1 จัตุรัส (1080 x 1080)</option>
    <option value="9:16">9:16 Story / LINE (1080 x 1920)</option>
    <option value="16:9">16:9 จอ TV (1920 x 1080)</option>
  </select>
  <label>ธีมสี</label>
  <div class="sw" id="thPick"></div>
  <div id="cusBox" style="display:none;margin-top:10px;border:1px solid #e2e8f0;border-radius:10px;padding:10px;background:#fafafa">
    <div class="g2">
      <div><label style="margin-top:0">สีหลัก (เข้ม)</label><input type="color" data-c="c1"></div>
      <div><label style="margin-top:0">สีรอง</label><input type="color" data-c="c2"></div>
    </div>
    <div class="g2">
      <div><label>สีเน้น</label><input type="color" data-c="ac"></div>
      <div><label>พื้นหลังกล่องหัวข้อ</label><input type="color" data-c="c3"></div>
    </div>
    <div class="g2">
      <div><label>พื้นหลังภาพ</label><input type="color" data-c="bg"></div>
      <div><label>วงกลมตกแต่ง</label><input type="color" data-c="dc"></div>
    </div>
    <button class="btn mini ok" id="autoTone" style="width:100%;margin-top:10px;padding:8px">สร้างเฉดอ่อนอัตโนมัติจากสีรอง</button>
  </div>
  <div class="g2" style="margin-top:10px">
    <div><label>ฟอนต์</label><select data-b="font">
      <option value="Kanit">Kanit</option><option value="Prompt">Prompt</option>
      <option value="Sarabun">Sarabun</option><option value="Noto Sans Thai">Noto Sans Thai</option></select></div>
    <div><label>ความละเอียด</label><select data-b="scale">
      <option value="1">1x ปกติ</option><option value="2">2x คมชัด</option><option value="3">3x สำหรับพิมพ์</option></select></div>
  </div>
  <label>ขนาดตัวอักษรรวม : <b id="fsVal">100%</b></label>
  <input type="range" id="fsRange" min="70" max="140" step="5" value="100">
  <div class="chk"><input type="checkbox" data-b="autoFit" id="caf"><label for="caf" style="margin:0">จัดหน้าอัตโนมัติ (ย่อฟอนต์เมื่อเนื้อหาล้น)</label></div>
  <div class="hint" id="afInfo"></div>
  <label>ชนิดไฟล์ที่บันทึก</label>
  <select data-b="format">
    <option value="png">PNG (รูปภาพคมชัด)</option>
    <option value="jpg">JPG (ไฟล์เล็ก)</option>
    <option value="pdf">PDF (เอกสาร / สั่งพิมพ์)</option>
  </select>
</div></details>

<details open><summary>2. หัวประกาศ</summary><div class="bd">
  <label>โลโก้หน่วยงาน</label>
  <div class="g2"><input type="file" id="logoFile" accept="image/*"><button class="btn mini" id="logoClr">ลบโลโก้</button></div>
  <div class="g2"><div><label>ชื่อหน่วยงาน (ไทย)</label><input type="text" data-b="orgTh"></div>
  <div><label>ชื่อหน่วยงาน (อังกฤษ)</label><input type="text" data-b="orgEn"></div></div>
  <div class="chk"><input type="checkbox" data-b="showLevel" id="c1c"><label for="c1c" style="margin:0">แสดงแถบระดับความรุนแรง</label></div>
  <div class="g2">
    <div><label>ระดับ</label><select data-b="level">
      <option value="0">1 แจ้งเพื่อทราบ</option><option value="1">2 เฝ้าระวัง</option>
      <option value="2">3 สำคัญ</option><option value="3">4 วิกฤต / เร่งด่วน</option></select></div>
    <div><label>ประเภทเหตุการณ์</label><input type="text" data-b="badge"></div>
  </div>
  <label>คำนำหน้าหัวข้อ</label><input type="text" data-b="titleTag">
  <label>หัวข้อเรื่อง</label><textarea data-b="title" style="min-height:58px"></textarea>
  <div class="g2">
    <div><label>ไอคอนหน้าหัวข้อ</label><select data-b="iconTitle" class="icsel"></select></div>
    <div><label>ไอคอนหน้าชื่อระบบ</label><select data-b="iconSys" class="icsel"></select></div>
  </div>
  <label>ชื่อระบบ / งาน (เว้นว่าง = ซ่อน)</label><input type="text" data-b="system">
</div></details>

<details open><summary>3. วัน - เวลา (ระบบ 24 ชั่วโมง)</summary><div class="bd">
  <div class="chk"><input type="checkbox" data-b="showWhen" id="c2c"><label for="c2c" style="margin:0">แสดงวันที่และเวลา</label></div>
  <div class="g2"><div><label>วันที่</label><input type="date" data-b="date"></div>
  <div><label>รูปแบบวันที่</label><select data-b="dateStyle">
    <option value="full">23 กันยายน 2569</option><option value="short">23 ก.ย. 69</option>
    <option value="num">23/09/2569</option><option value="eng">23 Sep 2026</option></select></div></div>
  <label>เวลาเริ่ม (ชั่วโมง : นาที)</label>
  <div class="g2"><select data-b="h1" class="hsel"></select><select data-b="m1" class="msel"></select></div>
  <label>เวลาสิ้นสุด</label>
  <div class="g2"><select data-b="h2" class="hsel"></select><select data-b="m2" class="msel"></select></div>
  <div class="warn" id="timeWarn"></div>
  <div class="g2" style="margin-top:10px">
    <div><label style="margin-top:0">ไอคอนวันที่</label><select data-b="iconDate" class="icsel"></select></div>
    <div><label style="margin-top:0">ไอคอนเวลา</label><select data-b="iconTime" class="icsel"></select></div>
  </div>
  <label>ข้อความวัน-เวลาแบบกำหนดเอง (กรอกแล้วใช้แทนค่าด้านบน)</label>
  <input type="text" data-b="customWhen" placeholder="เช่น ทุกวันเสาร์ เวลา 22.00 - 23.00 น.">
</div></details>

<details open><summary>4. เนื้อหาประกาศ</summary><div class="bd">
  <label>ชุดเนื้อหาสำเร็จรูป</label>
  <select id="quick"></select>
  <div class="g3" style="margin-top:8px">
    <button class="btn mini ok" id="pLoad">เรียกใช้</button>
    <button class="btn mini" id="pUpd">อัปเดตชุดนี้</button>
    <button class="btn mini danger" id="pDel">ลบชุดนี้</button>
  </div>
  <div class="g2" style="margin-top:8px">
    <button class="btn mini" id="pNew">บันทึกเป็นชุดใหม่</button>
    <button class="btn mini" id="pRen">เปลี่ยนชื่อชุด</button>
  </div>
  <button class="btn mini" id="pReset" style="width:100%;margin-top:8px;padding:8px">คืนค่าชุดเริ่มต้นของระบบ</button>
  <div class="hint">พิมพ์ **ข้อความ** = ตัวหนา &nbsp;|&nbsp; ==ข้อความ== = เน้นสีแดง</div>
  <div id="secList" style="margin-top:12px"></div>
  <button class="btn mini" id="addSec" style="width:100%;padding:9px">+ เพิ่มบล็อกเนื้อหา</button>
</div></details>

<details><summary>5. ท้ายประกาศ / ผู้ติดต่อ</summary><div class="bd">
  <div class="chk"><input type="checkbox" data-b="showFoot" id="c3c"><label for="c3c" style="margin:0">แสดงแถบติดต่อด้านล่าง</label></div>
  <label>ข้อความนำ</label><input type="text" data-b="contactLabel">
  <label>ชื่อหน่วยงานผู้ติดต่อ</label><input type="text" data-b="dept">
  <label>สถานที่</label><input type="text" data-b="place">
  <div class="g2"><div><label>โทรในเวลา</label><input type="text" data-b="phoneIn"></div>
  <div><label>โทรนอกเวลา</label><input type="text" data-b="phoneOut"></div></div>
  <div class="g2">
    <div><label>ไอคอนหน่วยงาน</label><select data-b="iconFoot" class="icsel"></select></div>
    <div><label>ไอคอนโทรศัพท์</label><select data-b="iconPhone" class="icsel"></select></div>
  </div>
  <label>หมายเหตุท้ายภาพ</label><input type="text" data-b="note">
</div></details>

<details><summary>6. จัดการไอคอน</summary><div class="bd">
  <div id="icList"></div>
  <div style="border:1px dashed #cbd5e1;border-radius:10px;padding:10px;margin-top:10px">
    <label style="margin-top:0">เพิ่มไอคอนใหม่</label>
    <input type="text" id="icName" placeholder="ชื่อไอคอน เช่น รถพยาบาล">
    <label>วิธีที่ 1 : อัปโหลดรูป (PNG พื้นหลังโปร่งใสสวยที่สุด)</label>
    <input type="file" id="icFile" accept="image/*">
    <label>วิธีที่ 2 : วางโค้ด SVG path จาก feathericons.com</label>
    <textarea id="icPath" style="min-height:56px"></textarea>
    <button class="btn mini ok" id="icAdd" style="width:100%;margin-top:8px;padding:8px">เพิ่มไอคอน</button>
  </div>
  <button class="btn mini" id="icReset" style="width:100%;margin-top:10px;padding:8px">คืนค่าไอคอนเริ่มต้น</button>
</div></details>

<details><summary>7. บันทึก / จัดการข้อมูล</summary><div class="bd">
  <label>ชื่อแบบร่าง</label>
  <div class="g2"><input type="text" id="dName"><button class="btn mini ok" id="dSave">บันทึก</button></div>
  <label>แบบร่างที่บันทึกไว้</label>
  <select id="dList"></select>
  <div class="g2" style="margin-top:8px"><button class="btn mini" id="dLoad">เรียกใช้</button><button class="btn mini danger" id="dDel">ลบ</button></div>
  <label>พื้นที่เก็บข้อมูลในเครื่อง</label>
  <div class="bar"><span id="stBar" style="width:0%"></span></div>
  <div class="hint" id="stTxt"></div>
  <label>สำรอง / ย้ายข้อมูล</label>
  <div class="g2"><button class="btn mini" id="expJ">ส่งออก JSON</button><button class="btn mini" id="impB">นำเข้า JSON</button></div>
  <input type="file" id="impJ" accept="application/json" hidden>
  <button class="btn mini danger" id="reset" style="width:100%;margin-top:12px;padding:9px">รีเซ็ตทั้งหมด</button>
</div></details>

</aside>
<main id="stage"><div id="holder"><div id="wrap"><div id="poster" class="poster"></div></div></div></main>
</div>
<div class="toast" id="toast"></div>

<script>
function $(q) { return document.querySelector(q); }
function $$(q, c) { return Array.prototype.slice.call((c || document).querySelectorAll(q)); }

var BASEIC = {
  megaphone: { n: 'ลำโพง / ประกาศ', p: '<path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 010 14.14"/><path d="M15.54 8.46a5 5 0 010 7.07"/>' },
  users: { n: 'กลุ่มคน / ผู้รับผลกระทบ', p: '<path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/>' },

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function fmt(s) {
  var x = esc(s);
  x = x.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  x = x.replace(/==(.+?)==/g, '<span class="hl">$1</span>');
  x = x.replace(/\n/g, '<br>');
  return x;
}

function hx(v) {
  v = Math.max(0, Math.min(255, Math.round(v)));
  return ('0' + v.toString(16)).slice(-2);
}

function mixHex(hex, p) {
  if (!hex || hex.charAt(0) !== '#') { return hex; }
  var r = parseInt(hex.substr(1, 2), 16);
  var g = parseInt(hex.substr(3, 2), 16);
  var b = parseInt(hex.substr(5, 2), 16);
  return '#' + hx(r * p + 255 * (1 - p)) + hx(g * p + 255 * (1 - p)) + hx(b * p + 255 * (1 - p));
}

function toast(m) {
  var t = $('#toast');
  if (!t) { return; }
  t.textContent = m;
  t.className = 'toast on';
  clearTimeout(t._t);
  t._t = setTimeout(function () { t.className = 'toast'; }, 2400);
}

function theme() {
  if (S.theme === 'custom') { return S.cus; }
  return TH[S.theme] || TH.green;
}

function size() {
  var r = S.template === 't3' ? '16:9' : S.ratio;
  return SZ[r] || SZ['a4'];
}

function col(k) {
  var t = theme();
  var m = { c1: t.c1, c2: t.c2, ac: t.ac, danger: '#dc2626', info: '#0284c7', purple: '#7c3aed' };
  return m[k] || t.c2;
}

    localStorage.setItem(KPR, JSON.stringify(PR));
  } catch (e) {}
}

function ic(k, sz, color) {
  if (!k || !IC[k]) { return ''; }
  var o = IC[k];
  if (o.img) {
    return '<img src="' + o.img + '" style="width:' + sz + 'px;height:' + sz + 'px;object-fit:contain;flex:none">';
  }
  var st = color || 'currentColor';
  return '<svg width="' + sz + '" height="' + sz + '" viewBox="0 0 24 24" fill="none" stroke="' + st + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none">' + o.p + '</svg>';
}

function icOpts(sel) {
  var h = '<option value="">- ไม่ใช้ไอคอน -</option>';
  for (var k in IC) {
    h += '<option value="' + k + '"' + (sel === k ? ' selected' : '') + '>' + esc(IC[k].n) + '</option>';
  }
  return h;
}

function when() {
  if ((S.customWhen || '').trim()) {
    return { d: S.customWhen.trim(), t: '' };
  }
  var d = '';
  if (S.date) {
    var x = new Date(S.date + 'T00:00:00');
    var D = x.getDate();
    var M = x.getMonth();
    var Y = x.getFullYear();
    var B = Y + 543;
    if (S.dateStyle === 'full') { d = D + ' ' + MF[M] + ' ' + B; }
    else if (S.dateStyle === 'num') { d = D + '/' + ('0' + (M + 1)).slice(-2) + '/' + B; }
    else if (S.dateStyle === 'eng') { d = D + ' ' + ME[M] + ' ' + Y; }
    else { d = D + ' ' + MS[M] + ' ' + String(B).slice(2); }
  }
  var t = '';
  if (S.h1) { t = S.h1 + '.' + (S.m1 || '00'); }
  if (t && S.h2) { t += ' - ' + S.h2 + '.' + (S.m2 || '00'); }
  return { d: d, t: t };
}

function build() {
  var t = theme();
  var T = S.template;
  var sz = size();
  var W = sz[0];
  var w = when();
  var big = T === 't1';
  var k = 0.88;
  if (big) { k = 1; }
  else if (T === 't3') { k = 0.92; }
  var uf = ((+S.fontScale || 100) / 100) * AF;

  function fs(n) { return Math.round(n * k * uf) + 'px'; }

  var pad = Math.round((big ? 48 : 44) * k);
  var cwr = 0.70;
  if (T === 't3') { cwr = 0.48; }
  else if (T === 't4') { cwr = 0.86; }
  var cw = W * cwr;

  var inner = '<span style="font-weight:700;color:' + t.c2 + ';font-size:' + fs(18) + '">LOGO</span>';
  if (S.logo) { inner = '<img src="' + S.logo + '">'; }
  var logo = '<div class="logo" style="width:' + fs(100) + ';height:' + fs(100) + ';border:3px solid ' + t.c2 + '">' + inner + '</div>';

  var head = '<div class="head">' + logo +
    '<div class="oline" style="background:' + t.c2 + '"></div><div>' +
    '<div class="orgth" style="font-size:' + fs(38) + ';color:' + t.c1 + '">' + esc(S.orgTh) + '</div>' +
    '<div class="orgen" style="font-size:' + fs(23) + ';color:' + t.c2 + '">' + esc(S.orgEn) + '</div></div></div>';

  var lvl = '';
  if (S.showLevel) {
    var L = +S.level;
    var dots = '';
    for (var i = 0; i < 4; i++) {
      var dc = i === L ? LV[i].c : mixHex(LV[i].c, 0.25);
      dots += '<span class="dot" style="width:' + fs(21) + ';height:' + fs(21) + ';background:' + dc + '"></span>';
    }
    lvl = '<div class="lvlw" style="margin-top:' + fs(16) + '"><div class="lvl" style="background:' + t.c3 + ';color:' + t.c1 + ';font-size:' + fs(22) + ';padding:' + fs(8) + ' ' + fs(22) + '">' +
      '<span>ระดับ</span><span class="dots">' + dots + '</span><span style="opacity:.35">|</span><span>' + esc(S.badge || LV[L].n) + '</span></div></div>';
  }

  var ti = ic(S.iconTitle, Math.round(66 * k * uf), '#dc2626');
  var tiw = '';
  if (ti) { tiw = '<span style="color:#dc2626">' + ti + '</span>'; }
  var title = '<div class="tbox" style="margin-top:' + fs(18) + ';justify-content:' + (big ? 'center' : 'flex-start') + '">' + tiw + '<div>' +
    '<span class="ttag" style="font-size:' + fs(40) + '">' + esc(S.titleTag) + '</span> ' +
    '<span class="ttl" style="font-size:' + fs(35) + ';color:' + t.c1 + '">' + esc(S.title) + '</span></div></div>';

  var wh = '';
  if (S.showWhen && (w.d || w.t)) {
    var di = ic(S.iconDate, Math.round(32 * k * uf), t.c2);
    var cli = ic(S.iconTime, Math.round(32 * k * uf), t.c2);
    var p1 = '';
    var p2 = '';
    var p3 = '';
    if (w.d) { p1 = '<span class="it"><span style="color:' + t.c2 + '">' + di + '</span>วันที่ : ' + esc(w.d) + '</span>'; }
    if (w.d && w.t) { p2 = '<span style="width:2px;height:' + fs(30) + ';background:' + t.c2 + ';opacity:.4"></span>'; }
    if (w.t) { p3 = '<span class="it"><span style="color:' + t.c2 + '">' + cli + '</span>เวลา : ' + esc(w.t) + ' น.</span>'; }
    wh = '<div class="when" style="margin-top:' + fs(16) + ';font-size:' + fs(24) + ';color:' + t.c1 + ';justify-content:' + (big ? 'center' : 'flex-start') + '">' + p1 + p2 + p3 + '</div>';
  }

  var sys = '';
  if ((S.system || '').trim()) {
    var si = ic(S.iconSys, Math.round(34 * k * uf), t.c2);
    var siw = '';
    if (si) { siw = '<span style="color:' + t.c2 + '">' + si + '</span>'; }
    sys = '<div class="sys" style="margin-top:' + fs(18) + ';background:' + t.c3 + ';color:' + t.c1 + ';font-size:' + fs(30) + ';padding:' + fs(11) + ' ' + fs(28) + '">' + siw + '<span>ระบบ : ' + esc(S.system) + '</span></div>';
  }

  var rows = '';
  for (var j = 0; j < S.sections.length; j++) {
    var s = S.sections[j];
    var c = col(s.color);
    var pos = s.imgPos || 'auto';
    var iw = +s.imgW || 60;
    var ar = +s.imgAR || 1.5;
    if (s.img && pos === 'auto') {
      pos = ar >= 1.35 ? 'top' : 'right';
    }
    var imgHtml = '';
    if (s.img) {
      var bw = Math.round(cw * (iw / 100));
      var bh = Math.round(bw / ar);
      imgHtml = '<img class="pimg" src="' + s.img + '" style="width:' + bw + 'px;height:' + bh + 'px;margin:' + fs(10) + ' 0">';
    }
    var plain = T === 't4';
    var txt = '';
    if (plain) {
      txt = '<div style="font-size:' + fs(24) + ';color:#334155;line-height:1.55;white-space:pre-wrap">' + fmt(s.text) + '</div>';
    } else {
      txt = '<div class="rt" style="font-size:' + fs(23) + ';padding:' + fs(15) + ' ' + fs(19) + '">' + fmt(s.text) + '</div>';
    }
    var body = txt;
    if (s.img) {
      if (pos === 'top') {
        body = imgHtml + txt;
      } else if (pos === 'bottom') {
        body = txt + imgHtml;
      } else {
        var dir = pos === 'left' ? '' : 'flex-direction:row-reverse';
        body = '<div style="display:flex;gap:' + fs(14) + ';align-items:flex-start;' + dir + '">' +
          '<div style="flex:none">' + imgHtml + '</div><div style="flex:1;min-width:0">' + txt + '</div></div>';
      }
    }
    if (plain) {
      rows += '<div style="border-left:8px solid ' + c + ';padding:2px 0 2px 22px;margin-bottom:' + fs(24) + '">' +
        '<div style="color:' + c + ';font-weight:700;font-size:' + fs(26) + ';margin-bottom:8px">' + esc(s.label) + '</div>' + body + '</div>';
    } else {
      var ri = ic(s.icon, Math.round(48 * k * uf));
      var riw = '';
      if (ri) { riw = '<div class="ric" style="width:' + fs(92) + ';height:' + fs(92) + ';background:' + c + '">' + ri + '</div>'; }
      rows += '<div class="row" style="background:' + mixHex(c, 0.08) + ';padding:' + fs(14) + ';margin-bottom:' + fs(14) + '">' + riw +
        '<div class="rb"><div class="rl" style="background:' + c + ';font-size:' + fs(25) + ';padding:' + fs(6) + ' ' + fs(20) + ';margin-bottom:' + fs(8) + '">' + esc(s.label) + '</div>' +
        body + '</div></div>';
    }
  }

  var foot = '';
  if (S.showFoot) {
    var fi = ic(S.iconFoot, Math.round(48 * k * uf));
    var pi = ic(S.iconPhone, Math.round(44 * k * uf));
    var ph = '';
    if (S.phoneIn || S.phoneOut) {
      var a1 = '';
      var a2 = '';
      if (S.phoneIn) { a1 = '<div class="ph"><i style="font-size:' + fs(15) + '">ในเวลาโทร.</i><b style="font-size:' + fs(22) + '">' + esc(S.phoneIn) + '</b></div>'; }
      if (S.phoneOut) { a2 = '<div class="ph"><i style="font-size:' + fs(15) + '">นอกเวลาโทร.</i><b style="font-size:' + fs(22) + '">' + esc(S.phoneOut) + '</b></div>'; }
      ph = '<div class="fr">' + pi + a1 + a2 + '</div>';
    }
    var pl = '';
    if (S.place) { pl = '<div class="fs" style="font-size:' + fs(18) + '">' + esc(S.place) + '</div>'; }
    foot = '<div class="foot" style="background:' + t.c1 + ';padding:' + fs(22) + ' ' + pad + 'px"><div class="fl">' + fi +
      '<div><div class="ft" style="font-size:' + fs(20) + '">' + esc(S.contactLabel) + ' ' + esc(S.dept) + '</div>' + pl + '</div></div>' + ph + '</div>';
  }

  var note = '';
  if ((S.note || '').trim()) {
    note = '<div class="note" style="font-size:' + fs(16) + ';padding:0 ' + pad + 'px ' + fs(10) + '">' + esc(S.note) + '</div>';
  }

  var d1 = Math.round(W * 0.5);
  var d2 = Math.round(W * 0.34);
  var deco = '<div class="deco" style="width:' + d1 + 'px;height:' + d1 + 'px;right:-' + Math.round(W * 0.17) + 'px;top:-' + Math.round(W * 0.26) + 'px;background:' + t.dc + '"></div>' +
    '<div class="deco" style="width:' + d2 + 'px;height:' + d2 + 'px;right:-' + Math.round(W * 0.12) + 'px;top:-' + Math.round(W * 0.19) + 'px;background:' + t.c2 + ';opacity:.25"></div>';

  if (T === 't3') {
    var headL = head.split('color:' + t.c1).join('color:#ffffff').split('color:' + t.c2).join('color:#bfe3c9');
    var lvlL = '';
    if (S.showLevel) {
      lvlL = lvl.replace('justify-content:center', 'justify-content:flex-start');
      lvlL = lvlL.split('background:' + t.c3).join('background:rgba(255,255,255,.14)');
      lvlL = lvlL.split('color:' + t.c1).join('color:#fff');
    }
    var whL = wh.split('color:' + t.c1).join('color:#fff');
    var footL = '';
    if (S.showFoot) {
      var ln = '';
      if (S.phoneIn) { ln += 'ในเวลา ' + esc(S.phoneIn) + '  '; }
      if (S.phoneOut) { ln += 'นอกเวลา ' + esc(S.phoneOut); }
      footL = '<div style="border-top:1px solid rgba(255,255,255,.25);padding-top:' + fs(14) + ';color:#dbeee1;font-size:' + fs(19) + ';line-height:1.5">' +
        esc(S.contactLabel) + ' ' + esc(S.dept) + '<br>' + esc(S.place) + '<br><b style="color:#fff;font-size:' + fs(22) + '">' + ln + '</b></div>';
    }
    var left = '<div style="width:' + Math.round(W * 0.4) + 'px;flex:none;background:' + t.c1 + ';padding:' + fs(46) + ' ' + fs(42) + ';display:flex;flex-direction:column;gap:' + fs(18) + '">' +
      headL + '<div><span class="ttag" style="font-size:' + fs(42) + ';color:#ffd166">' + esc(S.titleTag) + '</span>' +
      '<div class="ttl" style="font-size:' + fs(36) + ';color:#fff;margin-top:8px;line-height:1.3">' + esc(S.title) + '</div></div>' +
      lvlL + '<div style="margin-top:auto">' + whL + '</div>' + footL + '</div>';
    var right = '<div style="flex:1;padding:' + fs(40) + ' ' + fs(42) + ';position:relative;overflow:hidden">' + deco +
      '<div style="position:relative;z-index:2">' + sys + '<div style="margin-top:' + fs(18) + '">' + rows + '</div>' + note + '</div></div>';
    return { html: left + right, row: true, bg: t.bg };
  }

  if (T === 't4') {
    var headD = head.split('color:' + t.c1).join('color:#ffffff');
    headD = headD.split('color:' + t.c2).join('color:#c7e6d2');
    headD = headD.split('border:3px solid ' + t.c2).join('border:3px solid rgba(255,255,255,.6)');
    headD = headD.split('background:' + t.c2).join('background:rgba(255,255,255,.35)');
    var whD = wh.split('color:' + t.c1).join('color:#fff').split('color:' + t.c2).join('color:' + t.ac);
    var bg4 = '';
    if (S.badge) {
      bg4 = '<div style="display:inline-block;background:' + t.ac + ';color:#fff;font-weight:700;font-size:' + fs(21) + ';padding:6px 20px;border-radius:8px;margin-top:' + fs(24) + '">' + esc(S.badge) + '</div>';
    }
    var top4 = '<div style="background:' + t.c1 + ';padding:' + fs(38) + ' ' + pad + 'px ' + fs(32) + ';position:relative;overflow:hidden">' +
      '<div class="deco" style="width:' + Math.round(W * 0.4) + 'px;height:' + Math.round(W * 0.4) + 'px;right:-' + Math.round(W * 0.14) + 'px;top:-' + Math.round(W * 0.2) + 'px;background:rgba(255,255,255,.08)"></div>' +
      headD + bg4 +
      '<div class="ttl" style="font-size:' + fs(42) + ';color:#fff;margin-top:' + fs(14) + ';line-height:1.28">' + esc(S.titleTag) + ' ' + esc(S.title) + '</div>' +
      whD + '</div>';
    var mid4 = '<div style="padding:' + fs(34) + ' ' + pad + 'px;flex:1">' + rows + '</div>';
    return { html: top4 + mid4 + note + foot, row: false, bg: '#ffffff' };
  }

  var a = deco + '<div style="padding:' + fs(32) + ' ' + pad + 'px 0;position:relative;z-index:2">' + head + '</div>' + lvl;
  var b = '<div style="padding:0 ' + pad + 'px">' + title + wh + '</div>';
  var cD = '<div style="padding:0 ' + (pad + 16) + 'px">' + sys + '</div>';
  var d = '<div class="card" style="flex:1;margin:' + fs(18) + ' ' + fs(30) + ' ' + fs(20) + ';padding:' + fs(22) + ';border:2px solid ' + t.c3 + ';border-radius:26px">' + rows + '</div>';
  return { html: a + b + cD + d + note + foot, row: false, bg: t.bg };
}

function paint() {
  var p = $('#poster');
  if (!p) { return; }
  var sz = size();
  var r = build();
  p.style.width = sz[0] + 'px';
  p.style.height = sz[1] + 'px';
  p.style.background = r.bg;
  p.style.flexDirection = r.row ? 'row' : 'column';
  p.style.fontFamily = "'" + S.font + "', sans-serif";
  p.innerHTML = r.html;
}

function fit() {
  var wr = $('#wrap');
  var ho = $('#holder');
  var st = $('#stage');
  if (!wr || !ho || !st) { return; }
  var sz = size();
  var W = sz[0];
  var H = sz[1];
  var sw = st.clientWidth - 48;
  var sh = st.clientHeight - 48;
  if (!sw || sw < 120) { sw = 700; }
  if (!sh || sh < 120) { sh = 600; }
  var sc = Math.min(sw / W, sh / H);
  if (sc > 1) { sc = 1; }
  if (!(sc > 0.05)) { sc = 0.4; }
  wr.style.transform = 'scale(' + sc + ')';
  ho.style.width = Math.round(W * sc) + 'px';
  ho.style.height = Math.round(H * sc) + 'px';
}

function render() {
  try {
    var p = $('#poster');
    if (!p || !S) { return; }
    var H = size()[1];
    AF = 1;
    paint();
    if (S.autoFit) {
      var n = 0;
      while (p.scrollHeight > H + 2 && AF > 0.52 && n < 24) {
        AF -= 0.035;
        n++;
        paint();
      }
    }
    var info = $('#afInfo');
    if (info) {
      if (AF < 0.999) {
        info.textContent = 'จัดหน้าอัตโนมัติ : ย่อฟอนต์เหลือ ' + Math.round(AF * 100) + '% ให้พอดีกรอบ';
      } else if (p.scrollHeight > H + 2) {
        info.textContent = 'เนื้อหาล้นกรอบ - เปิดจัดหน้าอัตโนมัติ หรือลดขนาดตัวอักษร';
      } else {
        info.textContent = 'เนื้อหาพอดีกรอบ';
      }
    }
    checkTime();
    fit();
    save();
  } catch (e) {
    window.onerror(e.message, '', 0);
  }
}

function renderSoon() {
  clearTimeout(RT);
  RT = setTimeout(render, 90);
}

function checkTime() {
  var el = $('#timeWarn');
  if (!el) { return; }
  el.textContent = '';
  if (S.h1 && S.h2) {
    var a = (+S.h1) * 60 + (+(S.m1 || 0));
    var b = (+S.h2) * 60 + (+(S.m2 || 0));
    if (b < a) {
      el.textContent = 'หมายเหตุ : เวลาสิ้นสุดน้อยกว่าเวลาเริ่ม ระบบเข้าใจว่าเป็นการข้ามวัน';
    }
  }
}

function picks() {
  var a = '';
  for (var k in TPL) {
    a += '<button data-t="' + k + '" class="' + (S.template === k ? 'on' : '') + '">' + TPL[k] + '</button>';
  }
  var tp = $('#tplPick');
  if (tp) {
    tp.innerHTML = a;
    $$('#tplPick button').forEach(function (b) {
      b.onclick = function () {
        S.template = b.getAttribute('data-t');
        if (S.template === 't3') {
          S.ratio = '16:9';
        } else if (S.ratio === '16:9') {
          S.ratio = 'a4';
        }
        picks();
        form();
        render();
      };
    });
  }
  var s = '';
  for (var j in TH) {
    s += '<button title="' + TH[j].n + '" data-h="' + j + '" class="' + (S.theme === j ? 'on' : '') + '" style="background:linear-gradient(135deg,' + TH[j].c1 + ',' + TH[j].c2 + ')"></button>';
  }
  s += '<button class="cus ' + (S.theme === 'custom' ? 'on' : '') + '" data-h="custom">กำหนดเอง</button>';
  var tw = $('#thPick');
  if (tw) {
    tw.innerHTML = s;
    $$('#thPick button').forEach(function (b) {
      b.onclick = function () {
        S.theme = b.getAttribute('data-h');
        picks();
        render();
      };
    });
  }
  cusUI();
}

function cusUI() {
  var box = $('#cusBox');
  if (!box) { return; }
  box.style.display = S.theme === 'custom' ? 'block' : 'none';
  $$('[data-c]').forEach(function (el) {
    var k = el.getAttribute('data-c');
    if (S.cus && S.cus[k]) { el.value = S.cus[k]; }
  });
}

function form() {
  $$('[data-b]').forEach(function (el) {
    var v = S[el.getAttribute('data-b')];
    if (el.type === 'checkbox') {
      el.checked = !!v;
    } else {
      el.value = v == null ? '' : v;
    }
  });
  var r = $('#fsRange');
  if (r) {
    r.value = S.fontScale;
    var fv = $('#fsVal');
    if (fv) { fv.textContent = S.fontScale + '%'; }
  }
}

function timeSel() {
  var h = '<option value="">- ไม่ระบุ -</option>';
  var m = '';
  for (var i = 0; i < 24; i++) {
    var v = ('0' + i).slice(-2);
    h += '<option value="' + v + '">' + v + ' น.</option>';
  }
  for (var j = 0; j < 60; j++) {
    var u = ('0' + j).slice(-2);
    m += '<option value="' + u + '">' + u + ' นาที</option>';
  }
  $$('.hsel').forEach(function (e) { e.innerHTML = h; });
  $$('.msel').forEach(function (e) { e.innerHTML = m; });
}

function icSelAll() {
  $$('.icsel').forEach(function (e) {
    e.innerHTML = icOpts(S[e.getAttribute('data-b')]);
  });
}

function secs() {
  var box = $('#secList');
  if (!box) { return; }
  var ps = ['auto', 'top', 'bottom', 'left', 'right'];
  var pn = { auto: 'วางอัตโนมัติ', top: 'รูปอยู่บน', bottom: 'รูปอยู่ล่าง', left: 'รูปอยู่ซ้าย', right: 'รูปอยู่ขวา' };
  var h = '';
  for (var i = 0; i < S.sections.length; i++) {
    var s = S.sections[i];
    var o2 = '';
    for (var c in RC) {
      o2 += '<option value="' + c + '"' + (s.color === c ? ' selected' : '') + '>' + RC[c] + '</option>';
    }
    var o3 = '';
    for (var q = 0; q < ps.length; q++) {
      var cur = s.imgPos || 'auto';
      o3 += '<option value="' + ps[q] + '"' + (cur === ps[q] ? ' selected' : '') + '>' + pn[ps[q]] + '</option>';
    }
    h += '<div class="sec">';
    h += '<div class="sechead"><span class="no">' + (i + 1) + '</span>';
    h += '<input type="text" value="' + esc(s.label).replace(/"/g, '&quot;') + '" data-i="' + i + '" data-k="label">';
    h += '<button class="btn mini" data-mv="-1" data-i="' + i + '">&#8593;</button>';
    h += '<button class="btn mini" data-mv="1" data-i="' + i + '">&#8595;</button>';
    h += '<button class="btn mini danger" data-del="' + i + '">&#10005;</button></div>';
    h += '<div class="g2"><select data-i="' + i + '" data-k="icon">' + icOpts(s.icon) + '</select>';
    h += '<select data-i="' + i + '" data-k="color">' + o2 + '</select></div>';

function ensure(test, urls, cb) {
  if (test()) { return cb(); }
  var i = 0;
  function nx() {
    if (i >= urls.length) {
      toast('โหลดไลบรารีไม่สำเร็จ เครือข่ายอาจบล็อก CDN');
      return;
    }
    var s = document.createElement('script');
    s.src = urls[i];
    i++;
    s.onload = function () {
      if (test()) { cb(); } else { nx(); }
    };
    s.onerror = nx;
    document.head.appendChild(s);
  }
  nx();
}

function libs(needPdf, cb) {
  var u1 = ['https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
    'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js'];
  var u2 = ['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
    'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js'];
  ensure(function () { return !!window.html2canvas; }, u1, function () {
    if (!needPdf) { return cb(); }
    ensure(function () { return !!(window.jspdf && window.jspdf.jsPDF); }, u2, cb);
  });
}

function shot(needPdf, cb) {
  toast('กำลังสร้างไฟล์...');
  libs(needPdf, function () {
    var sz = size();
    var W = sz[0];
    var H = sz[1];
    var wr = $('#wrap');
    var ho = $('#holder');
    if (!wr || !ho) { return; }
    var old = wr.style.transform;
    wr.style.transform = 'none';
    ho.style.width = W + 'px';
    ho.style.height = H + 'px';
    function go() {
      html2canvas($('#poster'), {
        scale: +S.scale,
        backgroundColor: '#ffffff',
        useCORS: true,
        logging: false,
        width: W,
        height: H,
        windowWidth: W,
        scrollX: 0,
        scrollY: 0
      }).then(function (cv) {
        wr.style.transform = old;
        fit();
        cb(cv);
      }).catch(function (e) {
        wr.style.transform = old;
        fit();
        toast('สร้างไฟล์ไม่สำเร็จ : ' + e.message);
      });
    }
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () { setTimeout(go, 150); });
    } else {
      setTimeout(go, 150);
    }
  });
}

function fname() {
  var w = when();
  var t = (S.title || 'ประกาศ').replace(/[\\\/:*?"<>|]/g, '').slice(0, 40);
  var d = String(w.d || S.date).replace(/[\/ ]/g, '-');
  return 'ประกาศ_' + t + '_' + d;
}

function save() {
  try {
    var js = JSON.stringify(S);
    try { localStorage.setItem(KEY, js); } catch (e) {}
    if (!HIST.length || HIST[HIST.length - 1] !== js) {
      HIST.push(js);
      if (HIST.length > 15) { HIST.shift(); }
    }
    meter();
  } catch (e) {}
}

function meter() {
  var bar = $('#stBar');
  var txt = $('#stTxt');
  if (!bar || !txt) { return; }
  var keys = [KEY, KPR, KIC, DK];
  var total = 0;
  for (var i = 0; i < keys.length; i++) {
    try {
      var v = localStorage.getItem(keys[i]);
      if (v) { total += v.length; }
    } catch (e) {}
  }
  var mb = total / 1048576;
  var pct = Math.min(100, Math.round((mb / 5) * 100));
  bar.style.width = pct + '%';
  if (pct > 80) {
    bar.style.background = '#dc2626';
  } else if (pct > 60) {
    bar.style.background = '#f59e0b';
  } else {
    bar.style.background = '#2f7a43';
  }
  var warn = '';
  if (pct > 80) { warn = ' - ใกล้เต็ม ควรลบรูปหรือแบบร่างเก่า'; }
  txt.textContent = 'ใช้ไป ' + mb.toFixed(2) + ' MB จากประมาณ 5 MB (' + pct + '%)' + warn;
}

function merge(src) {
  var x = {};
  for (var k in DEF) { x[k] = DEF[k]; }
  if (src) {
    for (var k2 in src) {
      if (src[k2] !== undefined) { x[k2] = src[k2]; }
    }
  }
  if (!x.cus) { x.cus = JSON.parse(JSON.stringify(DEF.cus)); }
  if (!x.sections || !x.sections.length) {
    x.sections = JSON.parse(JSON.stringify(BASEPR['Restart Server ทำ OS Patching'].s));
  }
  return x;
}

      if (d) { d.click(); }
    }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) {
      var tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea') { return; }
      e.preventDefault();
      var u = $('#btnUndo');
      if (u) { u.click(); }
    }
  });

  window.addEventListener('resize', fit);
}

function init() {
  loadIC();
  loadPR();
  S = merge(null);
  try {
    var v = localStorage.getItem(KEY);
    if (v) { S = merge(JSON.parse(v)); }
  } catch (e) {
    S = merge(null);
  }
  if (!S.date) { S.date = new Date().toISOString().slice(0, 10); }
  if (S.fontScale == null) { S.fontScale = 100; }
  timeSel();
  wire();
  refreshAll();
  meter();
  setTimeout(fit, 120);
  setTimeout(fit, 600);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
